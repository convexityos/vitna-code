syntax = "proto3";

package vitna.protocol.v1;

// Stable envelope framing all Vitna Agent Protocol commands and events.
message ProtocolEnvelope {
  uint32 protocol_version_major = 1;
  uint32 protocol_version_minor = 2;
  uint32 schema_version = 3;
  string type_url = 4;
  string session_id = 5;
  string run_id = 6;
  uint64 sequence = 7;
  string idempotency_key = 8;
  bytes payload = 9;
}

// Client handshake negotiating supported protocol range
message HandshakeRequest {
  uint32 min_supported_version = 1;
  uint32 max_supported_version = 2;
  string client_identifier = 3;
}

message HandshakeResponse {
  uint32 selected_version_major = 1;
  uint32 selected_version_minor = 2;
  string daemon_build_commit = 3;
  bool accepted = 4;
  string rejection_reason = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_INVALID_FRAME = 2;
  ERROR_CODE_UNSUPPORTED_VERSION = 3;
  ERROR_CODE_UNKNOWN_COMMAND = 4;
  ERROR_CODE_POLICY_DENIED = 5;
  ERROR_CODE_NEEDS_RECONCILIATION = 6;
  ERROR_CODE_TIMEOUT = 7;
  ERROR_CODE_INTERNAL = 8;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string error_details = 3;
  string action_id = 4;
}
