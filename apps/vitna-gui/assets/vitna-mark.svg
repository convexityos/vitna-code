<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Vitna symbol, Aperture. Source of truth for every mark asset in public/.

    Four blades turning around a centre square. TRACED from the supplied
    artwork, not rebuilt from it, and the distinction is the whole point: the
    four blades are not copies of one another. Rotate this drawing 90 degrees
    and it overlaps itself 83%, where a constructed pinwheel overlaps 100%, so
    its edges wander about 1.7% of the height. That is eight pixels at icon
    size and a quarter of one in a tab, and it is deliberate. Rebuilding this
    as one blade rotated four times would produce a different, flatter mark.
    If this file ever needs redrawing, trace the artwork again. Do not
    construct it.

    Trace     Moore-neighbour boundary tracing at half alpha, a 7 pixel
              smoothing window, RDP at 0.9px of the 1185px master, then
              Catmull-Rom with corners broken above 48 degrees.
              99.5% overlap with the artwork, 175 anchor points.
    Ink       the periwinkle token in app/styles/tokens.css, set flat. The
              artwork arrived at #5c82fc and with its alpha plateau at 254;
              both were normalised on the way in.
    Measured  0.98 ink to grey at 16px, against 0.34 for the mark it replaced.
              As a raster the same drawing measures 0.73, which is why this
              ships as a vector and the icons are rasterised FROM it.

    To rebuild the raster set, on a transparent square canvas unless noted:
      vitna-mark-v3.png  384, ink at 100% (trimmed art, no inset)
      icon.png           512, ink at 92%
      apple-icon.png     180, ink at 76%, on the navy ground #0c1428
      favicon.ico        16, 32 and 48 at ink 92%, packed as PNG frames
    Then bump the matching ?v= in app/layout.tsx, per asset, not in lockstep,
    or returning visitors keep the old art.
  -->
