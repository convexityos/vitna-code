[package]
name = "vitna-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
egui_extras.workspace = true
arboard.workspace = true
serde.workspace = true
serde_json.workspace = true
vitna-protocol.workspace = true
# The window verifies receipts itself rather than asking the daemon to
# vouch for its own work. Both crates are serde plus hashing, no runtime.
vitna-receipts.workspace = true
vitna-receipt-verify.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows-sys.workspace = true

[[bin]]
name = "vitna-code"
path = "src/main.rs"
