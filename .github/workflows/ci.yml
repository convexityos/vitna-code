name: Vitna Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-rules:
    name: Repository Hygiene & Em-Dash Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for em-dashes
        run: |
          echo "Scanning for forbidden em-dash characters..."
          if grep -rn --exclude-dir=".git" -P "\x{2014}" .; then
            echo "ERROR: Forbidden em-dash character found in files above!"
            exit 1
          fi
          echo "Em-dash check passed."

  desktop:
    name: Desktop frontend (typecheck, test, build)
    needs: check-rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vitna-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vitna-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Also runs scripts/check-bundle.mjs: no third-party host, no sample
      # session and a Content-Security-Policy in the production bundle.
      - run: npm run build

  # Compiling a window proves nothing about whether it opens. This starts the
  # real binary on a virtual display, waits for it to map a window, and
  # photographs it. A crash on startup, a failed GL context or a window that
  # never maps all fail here, and the screenshot is kept either way so a
  # regression can be looked at rather than guessed at.
  gui-smoke:
    name: Desktop window opens
    needs: check-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install windowing and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev xvfb x11-utils imagemagick libgl1-mesa-dri libglx-mesa0 libegl1 libgbm1 mesa-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-smoke

      - name: Build the window
        run: cargo build -p vitna-gui --bin vitna-code

      - name: Open it and photograph it
        env:
          # llvmpipe: the runner has no GPU, and a software context is still a
          # real one as far as the application is concerned.
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x860x24 &
          export DISPLAY=:99
          sleep 2
          glxinfo -B 2>&1 | head -5 || echo "glxinfo unavailable"
          ./target/debug/vitna-code "$GITHUB_WORKSPACE" > app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "the window process exited before it mapped a window. Its output:"
              cat app.log
              exit 1
            fi
            if xwininfo -root -children | grep -qi "vitna"; then
              echo "window mapped after ${i}s"
              break
            fi
            sleep 1
          done
          sleep 3
          import -window root vitna-code-window.png
          xwininfo -root -children | head -20
          echo "--- application output ---"
          cat app.log || true
          kill "$APP_PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitna-code-window
          path: vitna-code-window.png
          if-no-files-found: error

  matrix-build:
    name: Build & Test (${{ matrix.target.os }} - ${{ matrix.target.arch }})
    needs: check-rules
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos
            arch: aarch64
            runner: macos-latest
            triple: aarch64-apple-darwin
          - os: windows
            arch: x86_64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: windows
            arch: aarch64
            runner: windows-11-arm64
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # vitna-gui links a window, so the Linux legs need the X11, Wayland and
      # GL development libraries. macOS and Windows carry theirs in the SDK.
      - name: Install Linux windowing libraries
        if: matrix.target.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace --no-fail-fast
