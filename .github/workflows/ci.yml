name: Vitna Code CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked pull request
  # targets the branch below it, so `branches: [main]` meant it got no checks at
  # all: not queued, not skipped, just absent. That is indistinguishable from
  # passing when read quickly, and this repository has had four stacked pull
  # requests open at once.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-rules:
    name: Repository Hygiene (em-dashes, runner labels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for em-dashes
        run: |
          echo "Scanning for forbidden em-dash characters..."
          if grep -rn --exclude-dir=".git" -P "\x{2014}" .; then
            echo "ERROR: Forbidden em-dash character found in files above!"
            exit 1
          fi
          echo "Em-dash check passed."
      # A runner label that matches no runner does not fail. It queues, and
      # GitHub cancels it 24 hours later, so the run concludes "cancelled"
      # with every step green. This job gates matrix-build, so a bad label
      # is caught before any leg can hang on it.
      - name: Validate runner labels
        run: node scripts/check-runner-labels.mjs

  desktop:
    name: Desktop frontend (typecheck, test, build)
    needs: check-rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vitna-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vitna-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Also runs scripts/check-bundle.mjs: no third-party host, no sample
      # session and a Content-Security-Policy in the production bundle.
      - run: npm run build

  matrix-build:
    name: Build & Test (${{ matrix.target.os }} - ${{ matrix.target.arch }})
    needs: check-rules
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            sandbox_backend: bubblewrap
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            sandbox_backend: bubblewrap
          - os: macos
            arch: aarch64
            runner: macos-latest
            triple: aarch64-apple-darwin
            sandbox_backend: seatbelt
          - os: windows
            arch: x86_64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: windows
            arch: aarch64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}

      - name: Install Linux sandbox backend
        if: matrix.target.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 denies unprivileged user namespaces by default, which
          # is exactly what bwrap needs. Without this it installs cleanly and
          # then fails at "setting up uid map".
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-pid --unshare-net --die-with-parent -- /bin/true
          echo "bwrap is usable on this runner"

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test
        env:
          # Where a platform is supposed to have a sandbox, a test that cannot
          # find one fails instead of skipping. A suite that quietly skips its
          # own subject is how "Sandbox Enforcement: Verified" survived with
          # nothing calling the sandbox at all.
          VITNA_REQUIRE_SANDBOX_BACKEND: ${{ matrix.target.sandbox_backend }}
        run: cargo test --workspace --no-fail-fast
