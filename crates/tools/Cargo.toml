[package]
name = "vitna-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
vitna-protocol.workspace = true
vitna-runner.workspace = true
vitna-git-workspaces.workspace = true
vitna-policy.workspace = true
vitna-sandbox.workspace = true
sha2.workspace = true
hex.workspace = true

# `workspace_fs` asks an opened handle where it lives, and opens without
# following a final link or blocking on a FIFO. std exposes neither.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
