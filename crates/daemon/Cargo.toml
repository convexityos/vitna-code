[package]
name = "vitna-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vitna-protocol.workspace = true
vitna-store.workspace = true
vitna-orchestration.workspace = true
vitna-policy.workspace = true
vitna-context.workspace = true
vitna-providers.workspace = true
vitna-tools.workspace = true
vitna-git-broker.workspace = true
vitna-git-workspaces.workspace = true
vitna-mcp.workspace = true
vitna-skills.workspace = true
vitna-receipts.workspace = true
vitna-telemetry.workspace = true
vitna-runner.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true

# The signing key file is created with a protected, owner-only DACL, which
# std cannot express.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The scripted provider the turn tests drive the agent loop with.
async-trait.workspace = true

[[bin]]
name = "vitna-coded"
path = "src/main.rs"